server:
  port: 8666

spring:
  application:
    name: screen-admin-server
  datasource:
    url: jdbc:h2:file:./data/screen-admin;MODE=Regular;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB

app:
  upload-dir: ./data/uploads
  cors:
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:5173,http://localhost:5174

management:
  endpoints:
    web:
      exposure:
        include: health
