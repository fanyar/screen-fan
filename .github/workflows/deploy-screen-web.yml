name: Deploy screen-web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: screen-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: screen-web/package-lock.json
      - run: npm ci
      - name: Install Linux native build dependencies
        run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.13.0 @esbuild/linux-x64@0.20.2
      - run: |
          set -o pipefail
          npm run build 2>&1 | tee build-output.log
        env:
          VITE_BASE_PATH: /screen-fan/
          VITE_USE_MOCK: 'true'
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-web-build-log
          path: screen-web/build-output.log
          if-no-files-found: warn
      - name: Summarize build failure
        if: failure()
        run: |
          tail -60 build-output.log | while IFS= read -r line; do
            echo "::error::${line}"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: screen-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
